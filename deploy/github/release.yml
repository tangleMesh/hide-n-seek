# Builds the live server image when a GitHub release is published and pushes it to the GitHub
# Container Registry as ghcr.io/<owner>/<repo>:<release tag> and :latest. It builds for amd64 and
# arm64, so it runs on the Mac mini's M1. The Mac mini's updater (deploy/update.sh) picks it up from there.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to build (e.g. v0.2.0)
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Image name and tag
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.event.release.tag_name || inputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Release tag matches package.json
        run: |
          v=$(node -p "require('./package.json').version")
          t="${{ steps.meta.outputs.tag }}"
          if [ "${t#v}" != "$v" ]; then echo "::warning::release tag $t but package.json says $v (the game shows $v)"; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Tests
        run: npm ci --no-audit --no-fund && npm test

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
